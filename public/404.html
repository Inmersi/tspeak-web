<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TSpeak</title>
    <meta name="robots" content="noindex" />
    <script>
      // Red de seguridad para las rutas de la SPA que no tienen un HTML
      // propio en el build. /privacy-policy y /delete-account si lo
      // tienen y no pasan por aqui: GitHub Pages las sirve con 200.
      //
      // Mandamos la ruta pedida en ?redirect= y saltamos a la RAIZ del
      // sitio, nunca a una ruta profunda: index.html referencia sus
      // assets de forma relativa, asi que solo resuelven bien si el
      // documento se carga en la raiz. src/main.tsx vuelve a poner la
      // URL bonita cuando el JS ya cargo.
      (function () {
        var loc = window.location;
        // Mismo criterio que src/lib/base.ts: en *.github.io el primer
        // segmento es el repositorio; en un dominio propio no hay prefijo.
        var esPages = loc.hostname.endsWith(".github.io");
        var base = esPages ? "/" + (loc.pathname.split("/")[1] || "") : "";
        var ruta = loc.pathname.slice(base.length) + loc.search + loc.hash;
        loc.replace(loc.origin + base + "/?redirect=" + encodeURIComponent(ruta));
      })();
    </script>
  </head>
  <body>
    <p>Redirigiendo…</p>
  </body>
</html>
