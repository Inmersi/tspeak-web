<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tspeak</title>
    <script>
      // Complemento de public/404.html: recupera la ruta original que
      // el 404 de GitHub Pages guardo en la query y la restaura en la
      // barra de direcciones antes de que el router monte.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var destino = params.get("redirect");
        if (destino) {
          window.history.replaceState(null, "", destino);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
